---
- name: Schedule Windows Disk Monitoring Script
  hosts: windows
  gather_facts: no

  vars:
    script_src: "../../scripts/windows/disk_metric_eventlog.ps1"
    script_dest: "C:\\DiskMetrics\\disk_metric_eventlog.ps1"
    task_name: "DiskMetricLogger"

  tasks:
    - name: Create script directory
      win_file:
        path: "C:\\DiskMetrics"
        state: directory

    - name: Copy disk metric script
      win_copy:
        src: "{{ script_src }}"
        dest: "{{ script_dest }}"

    - name: Register event log source
      win_command: powershell.exe New-EventLog -LogName Application -Source "DiskMonitor"
      ignore_errors: yes

    - name: Create scheduled task
      win_scheduled_task:
        name: "{{ task_name }}"
        description: "Log disk free percentage for ingestion"
        actions:
          - path: powershell.exe
            arguments: "-ExecutionPolicy Bypass -File {{ script_dest }}"
        triggers:
          - type: time
            repetition:
              interval: PT5M
        username: SYSTEM
        state: present
        enabled: yes
