---
- name: Schedule Linux Disk Monitoring Script
  hosts: linux
  become: yes
  gather_facts: yes

  vars:
    script_src: "../../scripts/linux/disk_metrics.sh"
    script_dest: "/opt/disk_metrics.sh"

  tasks:
    - name: Upload disk metrics script
      copy:
        src: "{{ script_src }}"
        dest: "{{ script_dest }}"
        mode: "0755"

    - name: Create cron job
      cron:
        name: "Disk Metrics Logger"
        job: "{{ script_dest }}"
        minute: "*/5"
        state: present
