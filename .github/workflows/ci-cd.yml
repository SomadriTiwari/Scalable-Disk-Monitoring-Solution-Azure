name: Azure Disk Monitoring CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch'
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply (manual)
        if: github.event_name == 'workflow_dispatch'
        working-directory: terraform
        run: terraform apply -auto-approve

  ansible:
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible
  
      - name: Run Ansible (install AMA + schedule scripts)
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          cd ansible
          ansible-playbook -i inventory/hosts.ini playbooks/install_ama_windows.yml
          ansible-playbook -i inventory/hosts.ini playbooks/install_ama_linux.yml
          ansible-playbook -i inventory/hosts.ini playbooks/schedule_windows_disk_script.yml
          ansible-playbook -i inventory/hosts.ini playbooks/schedule_linux_disk_script.yml
